services:
  - type: web
    name: netflix-trial-backend
    runtime: python
    plan: free
    region: singapore
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn net:app --workers 1 --bind 0.0.0.0:$PORT --timeout 120"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
